defaults:
  background:
    type: linear
    colors:
      - "#050817"
      - "#30376F"
    direction: 90

project:
  name: Tescam iPad App Store screenshots
  device: iPad Pro 13 - M4 - Silver - Portrait
  output_dir: asc_out/ipad
  output_size: iPadPro13

screenshots:
  01-overview:
    content:
      - type: text
        content: "Every angle, at a glance"
        color: "#FFFFFF"
        position: [50%, 8%]
        size: 86
        weight: bold
      - type: text
        content: "A spacious six-camera review workspace."
        color: "#C9D2EA"
        position: [50%, 15%]
        size: 42
      - type: image
        asset: raw/ipad/01-overview.png
        frame: true
        position: [50%, 61%]
        scale: 0.70
  02-playback:
    content:
      - type: text
        content: "Precise playback"
        color: "#FFFFFF"
        position: [50%, 8%]
        size: 86
        weight: bold
      - type: text
        content: "Scrub, skip and replay the moment."
        color: "#C9D2EA"
        position: [50%, 15%]
        size: 42
      - type: image
        asset: raw/ipad/02-playback.png
        frame: true
        position: [50%, 61%]
        scale: 0.70
  03-cameras:
    content:
      - type: text
        content: "Choose every angle"
        color: "#FFFFFF"
        position: [50%, 8%]
        size: 86
        weight: bold
      - type: text
        content: "Focus one camera or keep the full grid."
        color: "#C9D2EA"
        position: [50%, 15%]
        size: 42
      - type: image
        asset: raw/ipad/03-cameras.png
        frame: true
        position: [50%, 61%]
        scale: 0.70
  04-timeline:
    content:
      - type: text
        content: "Trim the moment"
        color: "#FFFFFF"
        position: [50%, 8%]
        size: 86
        weight: bold
      - type: text
        content: "Set an exact export range in seconds."
        color: "#C9D2EA"
        position: [50%, 15%]
        size: 42
      - type: image
        asset: raw/ipad/04-timeline.png
        frame: true
        position: [50%, 61%]
        scale: 0.70
  05-export:
    content:
      - type: text
        content: "Export your way"
        color: "#FFFFFF"
        position: [50%, 8%]
        size: 86
        weight: bold
      - type: text
        content: "Choose H.264 or H.265, with telemetry."
        color: "#C9D2EA"
        position: [50%, 15%]
        size: 42
      - type: image
        asset: raw/ipad/05-export.png
        frame: true
        position: [50%, 61%]
        scale: 0.70
