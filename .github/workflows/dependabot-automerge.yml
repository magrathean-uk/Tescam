name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  automerge:
    # Author check, not actor: a human re-running or rebasing must not trigger this.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Allow-list: grouped minor/patch PRs and single minor/patch bumps. Majors never match.
      # Merges only once the branch's required status checks are green.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.dependency-group == 'minor-and-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
