name: Native macOS tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: TescamTests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk macosx
          xcrun --show-sdk-version --sdk macosx

      - name: Build for testing
        run: |
          xcodebuild \
            -project Tescam.xcodeproj \
            -scheme Tescam \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build-for-testing

      - name: Run TescamTests
        run: |
          xcodebuild \
            -project Tescam.xcodeproj \
            -scheme Tescam \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -only-testing:TescamTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test-without-building
